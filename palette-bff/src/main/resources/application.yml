spring:
  application:
    name: palette-bff

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: PALETTE_SESSION
        http-only: true
        same-site: lax
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.palette.bff: INFO
    org.springframework.security: INFO

palette:
  auth:
    mode: oidc
    login-success-url: http://localhost:3000
    logout-success-url: http://localhost:3000
  cors:
    allowed-origins:
      - http://localhost:3000
  proxy:
    enabled: true
    base-url: http://localhost:9090

spring.security.oauth2.client:
  registration:
    palette:
      client-id: ${OIDC_CLIENT_ID:palette-bff}
      client-secret: ${OIDC_CLIENT_SECRET:change-me}
      scope:
        - openid
        - profile
        - email
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  provider:
    palette:
      issuer-uri: ${OIDC_ISSUER_URI:https://login.example.com/realms/palette}
