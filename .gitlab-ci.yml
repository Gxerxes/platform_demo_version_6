# Palette Platform - GitLab CI/CD Pipeline
# Phase 0: 基础 CI 流水线

stages:
  - install
  - lint
  - build
  - test

variables:
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "20"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  CI: "true"

.default_node:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - cd palette-ui
    - pnpm install --frozen-lockfile

# ── Install & Cache ──────────────────────────────────────────
install:
  extends: .default_node
  stage: install
  script:
    - pnpm install --frozen-lockfile
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - palette-ui/node_modules/
      - palette-ui/.pnpm-store/

# ── Lint ─────────────────────────────────────────────────────
lint:
  extends: .default_node
  stage: lint
  script:
    - pnpm lint
  needs: [install]

# ── Build ────────────────────────────────────────────────────
build:
  extends: .default_node
  stage: build
  script:
    - pnpm build
    - pnpm storybook:build
  artifacts:
    paths:
      - palette-ui/apps/showcase-app/dist/
      - palette-ui/storybook-static/
    expire_in: 1 week
  needs: [install]

# ── Test ─────────────────────────────────────────────────────
test:
  extends: .default_node
  stage: test
  script:
    - pnpm test
  needs: [install]

# ── BFF Build & Test ─────────────────────────────────────────
.default_maven:
  image: maven:3.9-eclipse-temurin-21
  before_script:
    - cd palette-bff

bff:test:
  extends: .default_maven
  stage: test
  script:
    - mvn -B clean test
  cache:
    key: maven-bff-${CI_COMMIT_REF_SLUG}
    paths:
      - palette-bff/.m2/repository/

bff:build:
  extends: .default_maven
  stage: build
  script:
    - mvn -B clean package -DskipTests
  artifacts:
    paths:
      - palette-bff/target/*.jar
    expire_in: 1 week
  needs: [bff:test]
